<!DOCTYPE html>
<html lang="{{ page.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.meta_title }}</title>
  <meta name="description" content="{{ page.description }}">
  <meta name="author" content="Gabriel Schütz">
  <link rel="canonical" href="{{ page.canonical }}">

  <!-- Language alternates: self-referential + reciprocal + x-default -->
  <link rel="alternate" hreflang="en" href="https://gabrielschutz.de/">
  <link rel="alternate" hreflang="de" href="https://gabrielschutz.de/de/">
  <link rel="alternate" hreflang="x-default" href="https://gabrielschutz.de/">

  <!-- Open Graph / Twitter -->
  <meta property="og:type" content="profile">
  <meta property="og:site_name" content="Gabriel Schütz">
  <meta property="og:title" content="{{ page.meta_title }}">
  <meta property="og:description" content="{{ page.description }}">
  <meta property="og:url" content="{{ page.canonical }}">
  <meta property="og:locale" content="{{ page.og_locale }}">
  <meta property="og:image" content="https://gabrielschutz.de/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Gabriel Schütz — Payment Infrastructure & Financial Systems Engineer">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.meta_title }}">
  <meta name="twitter:description" content="{{ page.description }}">
  <meta name="twitter:image" content="https://gabrielschutz.de/assets/og-image.png">

  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16191f" media="(prefers-color-scheme: dark)">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap">
  <link rel="stylesheet" href="/css/main.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Gabriel Schütz",
    "jobTitle": "Payment Infrastructure & Financial Systems Engineer",
    "url": "https://gabrielschutz.de/",
    "email": "mailto:gbrl.schutz@gmail.com",
    "knowsLanguage": ["pt", "de", "en", "fr"],
    "sameAs": [
      "https://www.linkedin.com/in/gabriel-schuetz",
      "https://github.com/gabrielgydu"
    ]
  }
  </script>
</head>
<body>
  <div class="wrap">
    <header class="site-head">
      <a class="wordmark" href="{% if page.lang == 'de' %}/de/{% else %}/{% endif %}">Gabriel Schütz<span class="dot">.</span></a>
      <nav class="langtoggle" aria-label="{% if page.lang == 'de' %}Sprache{% else %}Language{% endif %}">
        <a href="/"{% if page.lang == 'en' %} class="current" aria-current="page"{% endif %} hreflang="en">EN</a>
        <span aria-hidden="true">·</span>
        <a href="/de/"{% if page.lang == 'de' %} class="current" aria-current="page"{% endif %} hreflang="de">DE</a>
      </nav>
    </header>

    <main>
      {{ content }}
    </main>

    <footer class="site-foot">
      <span>© 2026 Gabriel Schütz</span>
      <ul>
        <li><a href="mailto:gbrl.schutz@gmail.com">gbrl.schutz<span aria-hidden="true"> [at] </span>gmail.com</a></li>
        <li><a href="https://www.linkedin.com/in/gabriel-schuetz" rel="me">LinkedIn</a></li>
        <li><a href="https://github.com/gabrielgydu" rel="me">GitHub</a></li>
      </ul>
    </footer>
  </div>
</body>
</html>
